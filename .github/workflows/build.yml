
name: Build Kip Visuals

on:
  workflow_dispatch:
  push:
    paths:
      - 'KipVisuals-1.21.4-Fabric-source.zip'
      - '.github/workflows/build.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Extract project
        run: unzip -q KipVisuals-1.21.4-Fabric-source.zip

      - name: Build mod
        working-directory: KipVisuals
        run: gradle build

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: Kip-Visuals-JAR
          path: KipVisuals/build/libs/kip-visuals-1.0.0.jar
          if-no-files-found: error
